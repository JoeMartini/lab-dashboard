<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Martini's Lab - 个人基础设施导航面板，聚合开发工具、数据分析、影音娱乐与智能家居服务">
    <meta name="theme-color" content="#0c0c0c" id="themeColor">
    <script>
    (function() {
        const saved = localStorage.getItem('lab-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeColor').setAttribute('content', theme === 'dark' ? '#0c0c0c' : '#fafafa');
    })();
    </script>
    <title>Dashboard · Martini's Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧪%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0c0c0c;
            --bg-elevated: #141414;
            --bg-card: #1a1a1a;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --text: #e5e5e5;
            --text-muted: #737373;
            --text-bright: #fafafa;
            --accent: #22d3ee;
            --accent-soft: rgba(34, 211, 238, 0.08);
            --accent-border: rgba(34, 211, 238, 0.25);
            --success: #34d399;
            --success-soft: rgba(52, 211, 153, 0.08);
            --warning: #fb923c;
            --warning-soft: rgba(251, 146, 60, 0.08);
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, 0.08);
            --amber: #d4a574;
            --amber-soft: rgba(212, 165, 116, 0.08);
        }

[data-theme="light"] {
            --bg: #fafafa;
            --bg-elevated: #f5f5f5;
            --bg-card: #ffffff;
            --border: rgba(0,0,0,0.08);
            --border-hover: rgba(0,0,0,0.15);
            --text: #1a1a1a;
            --text-muted: #737373;
            --text-bright: #0a0a0a;
            --accent: #0891b2;
            --accent-soft: rgba(8, 145, 178, 0.08);
            --accent-border: rgba(8, 145, 178, 0.25);
            --success: #059669;
            --success-soft: rgba(5, 150, 105, 0.08);
            --warning: #d97706;
            --warning-soft: rgba(217, 119, 6, 0.08);
            --danger: #dc2626;
            --danger-soft: rgba(220, 38, 38, 0.08);
            --amber: #b45309;
            --amber-soft: rgba(180, 83, 9, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle ambient background — no glassmorphism */
        .bg-ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 60% 40% at 15% 30%, rgba(34,211,238,0.025) 0%, transparent 70%),
                radial-gradient(ellipse 50% 30% at 85% 70%, rgba(212,165,116,0.02) 0%, transparent 70%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        /* Skip link for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--accent);
            color: #000;
            padding: 8px 16px;
            z-index: 100;
            transition: top 0.2s;
            font-weight: 500;
            border-radius: 0 0 8px 0;
        }
        .skip-link:focus { top: 0; }

        /* Header */
        header {
            margin-bottom: 48px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--amber));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(34,211,238,0.15);
            flex-shrink: 0;
        }

        .brand h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .brand .tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 400;
        }

        .theme-toggle {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: border-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .theme-toggle:hover { border-color: var(--border-hover); color: var(--text); }
        .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-elevated);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        /* Search */
        .search-wrap {
            margin-bottom: 40px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px 14px 48px;
            font-size: 0.95rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--accent-border);
            box-shadow: 0 0 0 3px rgba(34,211,238,0.08);
        }

        .search-input::placeholder { color: var(--text-muted); }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .search-hint {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Category sections */
        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-left: 4px;
        }

        .section-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .section-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-elevated);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            min-width: 24px;
            text-align: center;
        }

        /* Card grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-color: var(--accent-border);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            position: relative;
        }

        .card-avatar::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 11px;
            opacity: 0.3;
        }

        .card-avatar.accent { background: var(--accent-soft); }
        .card-avatar.success { background: var(--success-soft); }
        .card-avatar.warning { background: var(--warning-soft); }
        .card-avatar.danger { background: var(--danger-soft); }
        .card-avatar.amber { background: var(--amber-soft); }

        .card-title-wrap { min-width: 0; }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-bright);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-url {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .badge {
            font-size: 0.68rem;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid;
        }

        .badge.online {
            background: var(--success-soft);
            color: var(--success);
            border-color: rgba(52,211,153,0.15);
        }

        .badge.auth {
            background: var(--warning-soft);
            color: var(--warning);
            border-color: rgba(251,146,60,0.15);
        }

        .badge.internal {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: rgba(248,113,113,0.15);
        }

        .card-arrow {
            color: var(--text-muted);
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover .card-arrow,
        .card:focus-visible .card-arrow {
            opacity: 1;
        }

        /* Search highlight */
        .highlight {
            background: rgba(34, 211, 238, 0.15);
            color: var(--accent);
            border-radius: 2px;
            padding: 0 2px;
        }

        /* Status bar */
        .status-bar {
            margin-top: 48px;
            padding: 16px 20px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px rgba(52,211,153,0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Hidden by search */
        .card.hidden { display: none; }
        .section.hidden { display: none; }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .card { transition: none; }
            .card-arrow { transition: none; }
            .status-dot { animation: none; }
            .search-input { transition: none; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 24px 16px 48px; }
            header { flex-direction: column; align-items: flex-start; }
            .grid { grid-template-columns: 1fr; }
            .search-hint { display: none; }
            .status-bar { flex-direction: column; align-items: flex-start; }
        }

        /* Focus visible polyfill for older browsers */
        .card:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Source links & notes */
        .card-note {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            line-height: 1.4;
            opacity: 0.85;
        }
        .source-link {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.15s ease;
            margin-left: auto;
            margin-right: 8px;
        }
        .source-link[href] {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .source-link[href]:hover {
            background: var(--accent-border);
        }
        .source-link.original {
            color: var(--success);
            background: var(--success-soft);
            cursor: default;
        }
        .source-link.fork {
            color: var(--warning);
            background: var(--warning-soft);
        }
        .source-link.fork:hover {
            background: rgba(251, 146, 60, 0.2);
        }
    </style>
    <script src="config.js"></script>
</head>
<body data-theme="dark">
    <a href="#main-content" class="skip-link">跳转到主内容</a>
    <div class="bg-ambient"></div>

    <main id="main-content" class="container">
        <header>
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">🧪</div>
                <div>
                    <h1>Martini's Lab</h1>
                    <p class="tagline">Home Infrastructure Dashboard</p>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题 (T)" aria-label="切换主题">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">暗色</span>
            </button>
            <div class="clock" id="clock" aria-label="当前时间">--:--</div>
        </header>

        <div class="search-wrap" role="search">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input type="text" class="search-input" id="search" placeholder="搜索应用..." autocomplete="off" aria-label="搜索应用">
            <span class="search-hint">/</span>
        </div>

        <!-- 🛠️ Dev & Productivity -->
        <div id="services-app"></div>

        <!-- Status Bar -->
        <footer class="status-bar" role="contentinfo">
            <div class="status-item">
                <div class="status-dot" aria-hidden="true"></div>
                <span>系统正常运行</span>
            </div>
            <div class="status-item">
                <span>🐳 Docker 容器运行中</span>
            </div>
            <div class="status-item">
                <span>🔒 HTTPS: 通配符证书 *.example.com</span>
            </div>
            <div class="status-item">
                <span>🕐 自动刷新</span>
            </div>
        </footer>
    </main>

    <script>
        // Clock
        function updateClock() {
            const now = new Date();
            const pad = n => n.toString().padStart(2, '0');
            document.getElementById('clock').textContent =
                `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ` +
                `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        }
        updateClock();
        setInterval(updateClock, 30000); // update every 30s instead of every second

        // Dynamic section counts
        function updateSectionCounts() {
            document.querySelectorAll('.section').forEach(section => {
                const count = section.querySelectorAll('.card').length;
                const countEl = section.querySelector('.section-count');
                if (countEl) countEl.textContent = count;
            });
        }
        updateSectionCounts();

        // Search with highlight
        const search = document.getElementById('search');
        search.addEventListener('input', function() {
            const q = this.value.toLowerCase().trim();

            // Clear previous highlights
            document.querySelectorAll('.highlight').forEach(el => {
                const parent = el.parentNode;
                parent.insertBefore(document.createTextNode(el.textContent), el);
                parent.removeChild(el);
                parent.normalize();
            });

            document.querySelectorAll('.card').forEach(card => {
                const text = card.textContent.toLowerCase();
                const matches = !q || text.includes(q);
                card.classList.toggle('hidden', !matches);

                // Highlight matches
                if (matches && q) {
                    const titleEl = card.querySelector('.card-title');
                    const descEl = card.querySelector('.card-desc');
                    [titleEl, descEl].forEach(el => {
                        if (!el) return;
                        const txt = el.textContent;
                        const idx = txt.toLowerCase().indexOf(q);
                        if (idx >= 0) {
                            const before = txt.slice(0, idx);
                            const match = txt.slice(idx, idx + q.length);
                            const after = txt.slice(idx + q.length);
                            el.innerHTML = escapeHtml(before) + '<span class="highlight">' + escapeHtml(match) + '</span>' + escapeHtml(after);
                        }
                    });
                }
            });

            document.querySelectorAll('.section').forEach(section => {
                const visible = section.querySelectorAll('.card:not(.hidden)').length;
                section.classList.toggle('hidden', visible === 0);
            });
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === '/' && document.activeElement !== search) {
                e.preventDefault();
                search.focus();
            }
            if (e.key === 'Escape') {
                search.value = '';
                search.dispatchEvent(new Event('input'));
                search.blur();
            }
        });

        // Theme management
        function getTheme() {
            return document.documentElement.getAttribute('data-theme') || 'dark';
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.body.setAttribute('data-theme', theme);
            const tc = document.getElementById('themeColor');
            if (tc) tc.setAttribute('content', theme === 'dark' ? '#0c0c0c' : '#fafafa');
            updateThemeUI();
            try { localStorage.setItem('lab-theme', theme); } catch (e) {}
        }
        function updateThemeUI() {
            const t = getTheme();
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (icon) icon.textContent = t === 'dark' ? '🌙' : '☀️';
            if (label) label.textContent = t === 'dark' ? '暗色' : '亮色';
        }
        function toggleTheme() {
            setTheme(getTheme() === 'dark' ? 'light' : 'dark');
        }
        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('lab-theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
        document.addEventListener('keydown', e => {
            if (e.key === 't' || e.key === 'T') {
                if (document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    toggleTheme();
                }
            }
        });
        updateThemeUI();
    </script>
    <script>
    (function() {
        function getSourceLabel(source) {
            if (!source) return '';
            if (source.type === 'github') {
                return `<a class="source-link" href="${source.url}" target="_blank" rel="noopener noreferrer" title="${source.note || '开源项目'}">⭐ 开源</a>`;
            } else if (source.type === 'original') {
                return `<span class="source-link original" title="${source.note || '原创作品'}">✨ 原创</span>`;
            } else if (source.type === 'fork') {
                return `<a class="source-link fork" href="${source.url}" target="_blank" rel="noopener noreferrer" title="${source.note || '基于开源项目改造'}">🍴 改造</a>`;
            }
            return '';
        }

        function renderServices() {
            const container = document.getElementById('services-app');
            if (!container) return;
            if (typeof LAB_SERVICES === 'undefined') {
                container.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted)">请先创建 config.js 配置文件（复制 config.js.example）</p>';
                return;
            }
            const html = LAB_SERVICES.map(cat => `
                <section class="section" data-category="${cat.categoryId}" aria-labelledby="section-${cat.categoryId}">
                    <div class="section-header">
                        <div class="section-icon" style="background: var(--accent-soft);" aria-hidden="true">${cat.categoryIcon}</div>
                        <span class="section-title" id="section-${cat.categoryId}">${cat.category}</span>
                        <span class="section-count">${cat.items.length}</span>
                    </div>
                    <div class="grid">
                        ${cat.items.map(item => `
                        <a class="card" href="${item.href}" target="_blank" rel="noopener noreferrer">
                            <div class="card-header">
                                <div class="card-avatar ${item.avatarClass}" aria-hidden="true">${item.icon}</div>
                                <div class="card-title-wrap">
                                    <div class="card-title">${item.title}</div>
                                    <div class="card-url">${item.domain}</div>
                                </div>
                            </div>
                            <p class="card-desc">${item.desc}</p>
                            ${item.source && item.source.note ? `<p class="card-note">${item.source.note}</p>` : ''}
                            <div class="card-footer">
                                <span class="badge online">● 运行中</span>
                                ${getSourceLabel(item.source)}
                                <span class="card-arrow" aria-hidden="true">→</span>
                            </div>
                        </a>
                        `).join('')}
                    </div>
                </section>
            `).join('');
            container.innerHTML = html;
        }
        document.addEventListener('DOMContentLoaded', renderServices);
    })();
